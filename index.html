<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peritaciones</title>
<meta name="theme-color" content="#0b3a6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PERITACIONES">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Lista de siniestros -->
<section id="vista-lista" class="vista">
  <header class="portada">
    <div class="portada-fila">
      <div>
        <h1>PERITACIONES</h1>
        <p id="resumen" class="resumen"></p>
      </div>
      <button id="btn-nuevo" class="btn-nuevo">+ Nuevo</button>
    </div>
    <div class="buscador">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="buscar" type="search" placeholder="Buscar nº, dirección o compañía" autocomplete="off" enterkeyhint="search">
    </div>
  </header>
  <ul id="lista" class="lista"></ul>
  <p id="lista-vacia" class="vacio" hidden></p>
</section>

<!-- Detalle de un siniestro -->
<section id="vista-detalle" class="vista" hidden>
  <header class="barra">
    <button id="btn-volver" class="btn-texto">‹ Peritaciones</button>
    <button id="btn-editar" class="btn-texto">Editar</button>
  </header>
  <div class="ficha">
    <span id="det-compania" class="etiqueta"></span>
    <h2 id="det-numero"></h2>
    <p id="det-direccion" class="ficha-dir"></p>
    <label class="fecha-visita">📅 Fecha de visita
      <input id="det-fecha" type="date">
    </label>
    <p id="det-carpeta" class="carpeta"></p>
  </div>

  <h3>📷 Fotos <span id="num-fotos" class="contador"></span></h3>
  <div class="acciones">
    <button id="btn-camara" class="btn-primario grande">📷 Cámara</button>
    <label class="btn-secundario grande">
      📸 Cámara iPhone
      <input id="input-foto" type="file" accept="image/*" capture="environment" hidden>
    </label>
  </div>
  <div id="galeria" class="galeria con-margen"></div>

  <h3>📝 Notas</h3>
  <textarea id="notas" rows="10" placeholder="Escribe o dicta aquí lo de la visita…"></textarea>
  <p id="estado-notas" class="estado"></p>

  <h3>📏 Mediciones</h3>
  <p class="subtitulo">Solo para ti: no se pasan al PC ni se usan en el informe.</p>
  <form id="form-estancia" class="nueva-estancia">
    <input id="nueva-estancia" placeholder="Escribe la estancia (salón, cocina…)" autocomplete="off" enterkeyhint="done">
    <button class="btn-primario">Añadir</button>
  </form>
  <div id="mediciones"></div>

  <h3>✏️ Croquis</h3>
  <p class="subtitulo">Solo para ti: los croquis no se pasan al PC.</p>
  <button id="btn-nuevo-croquis" class="btn-secundario grande bloque">✏️ Abrir pizarra para pintar</button>
  <div id="lista-croquis" class="galeria croquis"></div>

  <button id="btn-sincronizar" class="btn-sync grande ancho">☁️ Sincronizar con el PC</button>
  <p id="estado-sync" class="estado"></p>
</section>

<!-- Cámara a pantalla completa -->
<section id="vista-camara" class="camara" hidden>
  <video id="video" playsinline autoplay muted></video>
  <div id="flash" class="flash"></div>
  <div class="camara-controles">
    <button id="btn-cerrar-camara" class="btn-camara">Listo</button>
    <button id="btn-disparar" class="disparador" aria-label="Hacer foto"></button>
    <span id="camara-contador" class="btn-camara contador-camara">0</span>
  </div>
</section>

<!-- Pizarra para croquis -->
<section id="vista-croquis" class="pizarra" hidden>
  <div class="pizarra-barra">
    <button id="cq-cerrar" class="btn-texto">Cancelar</button>
    <button id="cq-deshacer" class="btn-texto">↶ Deshacer</button>
    <button id="cq-limpiar" class="btn-texto">Limpiar</button>
    <button id="cq-guardar" class="btn-primario">Guardar</button>
  </div>
  <canvas id="lienzo"></canvas>
  <div class="pizarra-herramientas">
    <button class="color activo" data-color="#16202c" style="background:#16202c" aria-label="Negro"></button>
    <button class="color" data-color="#d32f2f" style="background:#d32f2f" aria-label="Rojo"></button>
    <button class="color" data-color="#1565c0" style="background:#1565c0" aria-label="Azul"></button>
    <button class="color" data-color="#2e7d32" style="background:#2e7d32" aria-label="Verde"></button>
    <button class="grosor" data-grosor="3">Fino</button>
    <button class="grosor activo" data-grosor="6">Medio</button>
    <button class="grosor" data-grosor="12">Grueso</button>
    <button id="cq-goma" class="grosor">Goma</button>
    <button id="cq-borrar" class="btn-peligro">Borrar</button>
  </div>
</section>

<!-- Ver una foto -->
<section id="vista-foto" class="visor" hidden>
  <img id="foto-grande" alt="">
  <div class="visor-controles">
    <button id="btn-borrar-foto" class="btn-peligro">Borrar</button>
    <button id="btn-cerrar-foto" class="btn-primario">Cerrar</button>
  </div>
</section>

<!-- Formulario nuevo / editar -->
<dialog id="dialogo">
  <form id="formulario" method="dialog">
    <h2 id="dialogo-titulo">Nuevo siniestro</h2>
    <label>Nº de siniestro
      <input id="f-numero" required inputmode="numeric" autocomplete="off">
    </label>
    <label>Compañía
      <select id="f-compania">
        <option>Zurich</option>
        <option>Sabadell</option>
      </select>
    </label>
    <label>Dirección
      <input id="f-direccion" required autocomplete="off">
    </label>
    <p id="f-error" class="error"></p>
    <div class="dialogo-botones">
      <button type="button" id="btn-borrar-siniestro" class="btn-peligro" hidden>Borrar</button>
      <button type="button" id="btn-cancelar" class="btn-texto">Cancelar</button>
      <button type="submit" class="btn-primario">Guardar</button>
    </div>
  </form>
</dialog>

<script src="db.js"></script>
<script src="drive.js"></script>
<script src="mediciones.js"></script>
<script src="croquis.js"></script>
<script src="app.js"></script>
</body>
</html>
